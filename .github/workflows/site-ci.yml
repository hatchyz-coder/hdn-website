name: Corporate site CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: corporate-site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint repository scripts and conflict markers
        run: |
          bash -n scripts/build-pages.sh
          bash -n scripts/verify-site.sh
          git diff --check
          ! grep -R --include='*.html' --include='*.css' --include='*.js' --include='*.py' --include='*.sh' --exclude-dir=.git --exclude-dir=_site '<<<<<<<' .
          ! grep -R --include='*.html' --include='*.css' --include='*.js' --include='*.py' --include='*.sh' --exclude-dir=.git --exclude-dir=_site '>>>>>>>' .

      - name: Repository verification
        run: bash scripts/verify-site.sh

      - name: Build
        run: bash scripts/build-pages.sh

      - name: Verify built output and links
        run: |
          test -s _site/index.html
          test -s _site/llms.txt
          test -s _site/self-pay.html
          test -s _site/lhub.html
          test -s _site/consultation.html
          test -s _site/consultation-form.html
          test -s _site/en/index.html
          test -s _site/en/consultation-form.html
          test -s _site/assets/editorial.css
          python3 scripts/audit-links.py

      - name: Verify consultation and editorial safeguards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          public = [*Path('.').glob('*.html'), *Path('en').glob('*.html')]
          errors = []
          for path in public:
              text = path.read_text(encoding='utf-8')
              low = text.lower()
              if 'forms.gle/' in low or 'docs.google.com/forms/' in low:
                  errors.append(f'{path}: Google Form URL remains')
              if path.parts and path.parts[0] == 'en' and path.name != 'consultation-form.html':
                  for href in __import__('re').findall(r'href="([^"]*consultation-form\.html[^"]*)"', text, flags=__import__('re').I):
                      if not href.startswith('/en/consultation-form.html'):
                          errors.append(f'{path}: English CTA leaves English consultation journey: {href}')
          css = Path('_site/assets/editorial.css').read_text(encoding='utf-8')
          for token in ('HDN editorial design layer', 'prefers-reduced-motion'):
              if token not in css:
                  errors.append(f'editorial.css: missing safeguard {token}')
          if css.count('{') != css.count('}'):
              errors.append('editorial.css: unbalanced braces')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('Corporate site safeguards verified.')
          PY

      - name: Typecheck and migration scope
        run: |
          echo "Typecheck: not applicable — static HTML/CSS/JavaScript site without TypeScript toolchain."
          echo "Migration check: not applicable — no database layer in this repository."

      - name: Live published pricing smoke test
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import time
          import urllib.error
          import urllib.request

          pages = {
              "https://hdnjapan.com/lhub.html": ["月額30,000円（税別）", "初期導入費は200,000円（税別）", "月額65,000円（税別・任意）", "月額95,000円（税別）"],
              "https://hdnjapan.com/pricing.html": ["初期導入費", "200,000円", "30,000円", "65,000円", "110,000円", "55,000円", "（税別）"],
              "https://hdnjapan.com/article-service.html": ["110,000円", "55,000円", "（税別）"],
              "https://hdnjapan.com/en/self-pay.html": ["JPY 200,000 excl. tax", "JPY 30,000 excl. tax", "JPY 65,000 per month excl. tax", "JPY 110,000 excl. tax", "JPY 55,000 excl. tax"],
          }
          for url, expected in pages.items():
              last_error = ""
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "HDN-site-pricing-smoke-test/1.0", "Cache-Control": "no-cache"})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          body = response.read().decode("utf-8")
                          status = response.status
                          final_url = response.url
                      missing = [part for part in expected if part not in body]
                      old = []
                      if "/en/self-pay.html" in url:
                          old = [part for part in ("JPY 110,000 incl. tax", "JPY 55,000 incl. tax", "Tax treatment and contract terms are explained before agreement.") if part in body]
                      elif "/lhub.html" in url:
                          old = [part for part in ("税区分を含む正式な契約条件は", "税区分は契約前に案内します") if part in body]
                      if status != 200 or missing or old:
                          raise ValueError(f"status={status}, url={final_url}, missing={missing}, old={old}")
                      print(f"PASS published pricing: HTTP {status} {url}", flush=True)
                      break
                  except (OSError, UnicodeError, ValueError) as e:
                      last_error = str(e)
                      print(f"Attempt {attempt}/3 for {url}: {last_error}", flush=True)
                      if attempt < 3:
                          time.sleep(8)
              else:
                  raise SystemExit(f"FAIL public pricing: {url}: {last_error}")
          print("All four public pricing pages verified from GitHub runner.")
          PY
