name: Apply generated site fixes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/build-pages.sh
      - scripts/postprocess-site.py
      - scripts/refine-brand-pages.py
      - scripts/optimize-conversion-seo.py
      - scripts/add-support-patterns.py
      - scripts/strengthen-trust-pages.py
      - scripts/add-article-bridges.py
      - scripts/add-legal-pages.py
      - scripts/fix-legal-and-contact-links.py
      - scripts/apply-mobile-audit.py
      - scripts/verify-site.sh
      - assets/site-shell.css
      - assets/site-shell.js
      - assets/consultation-form.js
      - assets/editorial.css
      - assets/mobile-audit.css
      - index.html
      - self-pay.html
      - lhub.html
      - lhub-lp.html
      - medical-sns.html
      - tsuyoshi-hadano.html
      - consultation.html
      - consultation-form.html
      - privacy.html
      - terms.html
      - cookie-policy.html
      - security.html
      - disclaimer.html
      - en/**
      - .github/workflows/apply-build-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[generated-site]') == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build generated site
        run: bash scripts/build-pages.sh

      - name: Apply evidence-first visual postprocess
        run: python3 scripts/postprocess-site.py

      - name: Refine brand pages and social metadata
        run: python3 scripts/refine-brand-pages.py

      - name: Harden conversion and SEO metadata
        run: python3 scripts/optimize-conversion-seo.py

      - name: Add anonymized support patterns
        run: python3 scripts/add-support-patterns.py

      - name: Strengthen founder and consultation trust
        run: python3 scripts/strengthen-trust-pages.py

      - name: Connect corporate pages to published articles
        run: python3 scripts/add-article-bridges.py

      - name: Add legal policy pages and footer navigation
        run: python3 scripts/add-legal-pages.py

      - name: Repair legal and first-party contact links
        run: python3 scripts/fix-legal-and-contact-links.py

      - name: Apply final mobile UI audit
        run: python3 scripts/apply-mobile-audit.py

      - name: Write generated pages back to published branch root
        run: |
          cp _site/index.html index.html
          cp _site/self-pay.html self-pay.html
          cp _site/lhub.html lhub.html
          cp _site/lhub-lp.html lhub-lp.html
          cp _site/medical-sns.html medical-sns.html
          cp _site/tsuyoshi-hadano.html tsuyoshi-hadano.html
          cp _site/consultation.html consultation.html
          cp _site/consultation-form.html consultation-form.html
          cp _site/privacy.html privacy.html
          cp _site/terms.html terms.html
          cp _site/cookie-policy.html cookie-policy.html
          cp _site/security.html security.html
          cp _site/disclaimer.html disclaimer.html
          mkdir -p en
          cp _site/en/index.html en/index.html
          cp _site/en/self-pay.html en/self-pay.html
          cp _site/en/lhub.html en/lhub.html
          cp _site/en/consultation-form.html en/consultation-form.html
          cp _site/en/privacy.html en/privacy.html
          cp _site/en/terms.html en/terms.html
          cp _site/en/cookie-policy.html en/cookie-policy.html
          cp _site/en/security.html en/security.html
          cp _site/en/disclaimer.html en/disclaimer.html

      - name: Verify generated safeguards and article bridges
        run: |
          for page in index.html self-pay.html lhub.html lhub-lp.html medical-sns.html tsuyoshi-hadano.html consultation.html en/index.html en/self-pay.html en/lhub.html; do
            grep -q 'editorial.css' "$page"
            grep -q 'mobile-audit.css' "$page"
            grep -q 'rel="canonical"' "$page"
            grep -q 'property="og:title"' "$page"
            grep -q 'name="twitter:card"' "$page"
            grep -q 'data-precontact-trust' "$page"
            grep -q 'data-legal-footer' "$page"
            grep -q 'privacy.html' "$page"
            grep -q 'terms.html' "$page"
            grep -q 'cookie-policy.html' "$page"
            grep -q 'security.html' "$page"
            grep -q 'disclaimer.html' "$page"
          done
          for page in privacy.html terms.html cookie-policy.html security.html disclaimer.html en/privacy.html en/terms.html en/cookie-policy.html en/security.html en/disclaimer.html; do
            test -s "$page"
            grep -q 'rel="canonical"' "$page"
            grep -q 'data-legal-footer' "$page"
          done
          for page in consultation-form.html en/consultation-form.html; do
            test -s "$page"
            grep -q 'meta name="robots" content="noindex,follow"' "$page"
            grep -q 'id="consultation-form"' "$page"
            grep -q 'privacy_consent' "$page"
          done
          grep -q '../assets/consultation-form.js' en/consultation-form.html
          grep -q 'Do not enter patient-identifying or clinical information' en/consultation-form.html
          grep -q '個人情報保護方針' privacy.html
          grep -q '保有個人データの開示等' privacy.html
          grep -q 'Google Analytics 4' cookie-policy.html
          grep -q '情報セキュリティ基本方針' security.html
          grep -q '支援例・試算・数値' disclaimer.html
          for page in index.html self-pay.html lhub.html en/index.html en/self-pay.html en/lhub.html; do
            grep -q 'site-shell.css' "$page"
            grep -q 'site-shell.js' "$page"
            grep -q 'class="language-switch"' "$page"
            grep -q 'hreflang="ja"' "$page"
            grep -q 'hreflang="en"' "$page"
            grep -q 'hreflang="x-default"' "$page"
          done
          for page in index.html self-pay.html lhub.html medical-sns.html en/index.html en/self-pay.html en/lhub.html; do
            grep -q 'data-article-bridge' "$page"
            grep -q 'article.hdnjapan.com' "$page"
          done
          for page in en/index.html en/self-pay.html en/lhub.html; do
            grep -q 'href="/en/consultation-form.html' "$page"
            ! grep -q 'href="/consultation-form.html' "$page"
          done
          grep -q 'line-booking-payment-flow' lhub.html
          grep -q 'clinic-video-strategy' medical-sns.html
          grep -q 'regenerative-medicine-improvement-orders' self-pay.html
          grep -q 'data-fv-journey' index.html
          grep -q 'data-deliverables' index.html
          grep -q 'data-support-patterns' index.html
          grep -q 'data-support-patterns' en/index.html
          grep -q 'data-founder-workstyle' tsuyoshi-hadano.html
          grep -q 'data-consultation-output' consultation.html
          grep -q 'id="hdn-website-schema"' index.html
          grep -q 'overflow-x: clip' assets/mobile-audit.css
          ! grep -R -q 'https://forms.gle/148jgfSnDgDZ2HsEA' index.html self-pay.html lhub.html lhub-lp.html medical-sns.html tsuyoshi-hadano.html consultation.html consultation-form.html privacy.html terms.html cookie-policy.html security.html disclaimer.html en/index.html en/self-pay.html en/lhub.html en/consultation-form.html en/privacy.html en/terms.html en/cookie-policy.html en/security.html en/disclaimer.html
          for page in en/privacy.html en/terms.html en/cookie-policy.html en/security.html en/disclaimer.html; do
            ! grep -q 'href="../privacy.html"' "$page"
            ! grep -q 'href="../terms.html"' "$page"
            ! grep -q 'href="../cookie-policy.html"' "$page"
            ! grep -q 'href="../security.html"' "$page"
            ! grep -q 'href="../disclaimer.html"' "$page"
            ! grep -q 'href="/en/#company"' "$page"
            ! grep -q 'href="/consultation-form.html' "$page"
          done
          python3 scripts/postprocess-site.py
          python3 scripts/refine-brand-pages.py
          python3 scripts/optimize-conversion-seo.py
          python3 scripts/add-support-patterns.py
          python3 scripts/strengthen-trust-pages.py
          python3 scripts/add-article-bridges.py
          python3 scripts/add-legal-pages.py
          python3 scripts/fix-legal-and-contact-links.py
          python3 scripts/apply-mobile-audit.py

      - name: Verify public site source
        run: bash scripts/verify-site.sh

      - name: Commit generated pages
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html self-pay.html lhub.html lhub-lp.html medical-sns.html tsuyoshi-hadano.html consultation.html consultation-form.html privacy.html terms.html cookie-policy.html security.html disclaimer.html en/index.html en/self-pay.html en/lhub.html en/consultation-form.html en/privacy.html en/terms.html en/cookie-policy.html en/security.html en/disclaimer.html
          git commit -m "Keep legal policies and site safeguards [generated-site]"
          git push
