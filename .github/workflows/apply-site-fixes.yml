name: Apply site fixes

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.event.issue.pull_request && github.event.comment.body == '/apply-site-fixes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/site-audit-20260729
          fetch-depth: 0

      - name: Apply HTML fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('href="https://hatchyz-coder.github.io/hdn-website/"', 'href="/"')
          index.write_text(text, encoding='utf-8')

          lhub = Path('lhub.html')
          text = lhub.read_text(encoding='utf-8')
          marker = '  <link rel="icon" href="assets/lhub-mark-color.png">'
          seo = '''  <link rel="canonical" href="https://hdnjapan.com/lhub.html">\n  <link rel="alternate" hreflang="ja" href="https://hdnjapan.com/lhub.html">\n  <link rel="alternate" hreflang="en" href="https://hdnjapan.com/en/lhub.html">\n  <link rel="alternate" hreflang="x-default" href="https://hdnjapan.com/lhub.html">\n  <meta property="og:type" content="website">\n  <meta property="og:locale" content="ja_JP">\n  <meta property="og:site_name" content="株式会社HDN">\n  <meta property="og:title" content="LHub | 医療機関のLINE患者CRM・予約・問診・決済基盤">\n  <meta property="og:description" content="LINE公式アカウント上で予約、問診、決済案内、顧客管理、配信、リッチメニューをつなぐ医療機関向け運用支援サービスです。">\n  <meta property="og:url" content="https://hdnjapan.com/lhub.html">\n  <meta property="og:image" content="https://hdnjapan.com/assets/lhub-line-commerce.png">\n  <meta property="og:image:alt" content="医療機関向けLINE患者CRM・予約・問診・決済基盤 LHub">\n  <meta name="twitter:card" content="summary_large_image">\n  <meta name="twitter:title" content="LHub | 医療機関のLINE患者CRM・予約・問診・決済基盤">\n  <meta name="twitter:description" content="予約、問診、決済案内、顧客管理、配信をLINE上でつなぐLHub。">\n  <meta name="twitter:image" content="https://hdnjapan.com/assets/lhub-line-commerce.png">\n  <script type="application/ld+json">\n  {\n    "@context": "https://schema.org",\n    "@type": "Service",\n    "@id": "https://hdnjapan.com/lhub.html#service",\n    "name": "LHub",\n    "url": "https://hdnjapan.com/lhub.html",\n    "description": "医療機関のLINE公式アカウントで予約、問診、決済案内、顧客管理、配信、リッチメニューを扱いやすくする運用支援サービスです。",\n    "serviceType": "医療機関向けLINE患者CRM・予約・問診・決済支援",\n    "areaServed": {"@type": "Country", "name": "日本"},\n    "provider": {\n      "@type": "Organization",\n      "@id": "https://hdnjapan.com/#organization",\n      "name": "株式会社HDN",\n      "url": "https://hdnjapan.com/"\n    }\n  }\n  </script>'''
          if 'rel="canonical" href="https://hdnjapan.com/lhub.html"' not in text:
              text = text.replace(marker, seo + '\n' + marker)
          text = text.replace('rel="noopener"', 'rel="noopener noreferrer"')
          lhub.write_text(text, encoding='utf-8')
          PY

      - name: Validate files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          for name in ['index.html','lhub.html']:
              text = Path(name).read_text(encoding='utf-8')
              assert '<<<<<<<' not in text and '>>>>>>>' not in text
          lhub = Path('lhub.html').read_text(encoding='utf-8')
          assert 'https://hdnjapan.com/lhub.html' in lhub
          for block in re.findall(r'<script type="application/ld\+json">(.*?)</script>', lhub, re.S):
              json.loads(block)
          assert 'https://hatchyz-coder.github.io/hdn-website/' not in Path('index.html').read_text(encoding='utf-8')
          PY
          if [ -x scripts/build-pages.sh ]; then bash scripts/build-pages.sh; fi
          if [ -x scripts/verify-site.sh ]; then bash scripts/verify-site.sh; fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html lhub.html
          git diff --cached --quiet || git commit -m "Fix canonical links and LHub SEO metadata"
          git push origin HEAD:fix/site-audit-20260729
